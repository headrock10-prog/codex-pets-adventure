<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#081520"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Codex Pets Adventure</title><link rel="stylesheet" href="style.css?v=11"></head><body><div id="start-screen"><button id="start-game">ゲームスタート</button></div><main><header><div><p>CODEX PETS ADVENTURE</p><h1 id="stage-title">STAGE 1：はじまりの森</h1></div><aside>❤️ <b id="hp">5</b>　👾 残り <b id="mob-count">5</b>　<span id="key-hud">🔑 <b id="key">0</b>/1</span></aside></header><section class="game"><canvas id="game" width="960" height="540"></canvas><div id="toast">Mura Bearと仲間たちの冒険が始まる！</div><div id="finish"><div><h2 id="clear-title">ステージクリア！</h2><p id="clear-text">6人の力で、はじまりの森を突破しました。</p><button id="next">ステージ2へ</button> <button id="again">もう一度遊ぶ</button></div></div></section><nav class="party"><button data-pet="0" class="active"><img src="assets/mura-a.png"><span>Mura</span><small>パンチ</small></button><button data-pet="1"><img src="assets/codex.webp"><span>Codex</span><small>ショット</small></button><button data-pet="2"><img src="assets/dewey.webp"><span>Dewey</span><small>水弾</small></button><button data-pet="3"><img src="assets/hoots.webp"><span>Hoots</span><small>羽根</small></button><button data-pet="4"><img src="assets/seedy.webp"><span>Seedy</span><small>ツタ</small></button><button data-pet="5"><img src="assets/ai.png"><span>Ai</span><small>応援</small></button></nav><div class="controls"><div><button id="left">◀</button><button id="right">▶</button></div><button id="power">なかまの力</button><button id="attack">ATTACK</button><button id="jump">JUMP</button></div><p class="help">← → 移動　Space ジャンプ　X 攻撃　1〜6 仲間選択　E 能力</p></main><script src="game.js?v=11"></script><script>const startScreen=document.getElementById("start-screen");document.getElementById("start-game").onclick=async()=>{try{await document.documentElement.requestFullscreen?.();await screen.orientation?.lock?.("landscape")}catch(e){}startScreen.classList.add("started")};if("serviceWorker" in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if("caches" in window)caches.keys().then(k=>k.forEach(x=>caches.delete(x)));</script></body></html>
